<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBP Kunststoffwerk - İnteraktif Fabrika Sahası</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="ust-bilgi">
        <h1>BBP Kunststoffwerk - İnteraktif Akış Haritası</h1>
        <p style="margin:5px 0 0 0; font-size:14px; color:#aaa;">Cihazları mouse ile sürükleyerek yerlerini değiştirebilirsiniz.</p>
    </header>

    <!-- GENİŞ FABRİKA SAHASI (Sürüklenebilir alan) -->
    <main id="fabrika-sahasi">
        <!-- Çizgilerin çizileceği devasa görünmez tuval -->
        <canvas id="cizim-alani"></canvas>
        
        <!-- Tüm cihazların içine atılacağı kapsayıcı -->
        <div id="cihazlar-kapsayici"></div>
    </main>

   <!-- DETAY / GÜNCELLEME PENCERESİ (MODAL) -->
    <div id="detay-modal" class="modal" style="display: none;">
        <div class="modal-icerik">
            <span class="kapat-btn" id="modal-kapat">&times;</span>
            <h3 id="modal-baslik">Detay Ayarları</h3>
            
            <label id="modal-etiket">Materyal/Bilgi:</label>
            <input type="text" id="modal-input-veri" class="modal-input">
            
            <div id="modal-baglanti-alani">
                <hr>
                <h4 style="margin-bottom: 5px;">Hedef Bağlantılar</h4>
                <p style="font-size: 11px; color: #666; margin-top: 0;">Birden fazla cihaza bağlamak için araya virgül koyun. (Örn: firin_7, makina_2)</p>
                
                <div id="silo-kanallari-inputlari">
                    <label>Kanal 1:</label> <input type="text" id="modal-kanal-1" class="modal-input" placeholder="Örn: firin_1, makina_5">
                    <label>Kanal 2:</label> <input type="text" id="modal-kanal-2" class="modal-input" placeholder="Boş">
                    <label>Kanal 3:</label> <input type="text" id="modal-kanal-3" class="modal-input" placeholder="Boş">
                    <label>Kanal 4:</label> <input type="text" id="modal-kanal-4" class="modal-input" placeholder="Boş">
                </div>
                
                <div id="firin-hedef-inputu" style="display: none;">
                    <label>Hedef Makinalar:</label> <input type="text" id="modal-firin-hedef" class="modal-input" placeholder="Örn: makina_1, makina_2">
                </div>
            </div>
            <button id="modal-kaydet" class="kaydet-btn">Kaydet ve Güncelle</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
