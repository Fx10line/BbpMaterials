<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabrika Malzeme Akış ve Takip Sistemi</title>
    <!-- CSS dosyamızı sayfamıza bağlıyoruz -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sayfanın en üstündeki başlık çubuğu -->
    <header class="ust-bilgi">
        <h1>BBP Kunststoffwerk - Üretim Takip Panosu</h1>
    </header>

    <!-- 3 ana sütunu tutacak olan dev çerçeve -->
    <main class="pano-kapsayici">

        <!-- 1. SÜTUN: SİLOLAR (14 Adet buraya gelecek) -->
        <section class="sutun" id="silolar-sutunu">
            <h2>SİLOLAR</h2>
            <p class="aciklama">Hammadde Depolama</p>
            
            <!-- Örnek bir Silo Kutusu (Şimdilik tasarımı görmek için 1 tane koyuyoruz) -->
            <div class="silo-kutusu">
                <div class="kutu-baslik">Silo 1</div>
                <div class="kutu-bilgi">Materyal: Polipropilen (PP)</div>
            </div>
        </section>

        <!-- 2. SÜTUN: FIRINLAR (16 Adet buraya gelecek) -->
        <section class="sutun" id="firinlar-sutunu">
            <h2>KURUTMA FIRINLARI</h2>
            <p class="aciklama">Nem ve Sıcaklık Kontrolü</p>

            <!-- Örnek bir Fırın Kutusu -->
            <div class="firin-kutusu">
                <div class="kutu-baslik">Fırın 1</div>
                <div class="kutu-bilgi">Sıcaklık: 80°C</div>
                <!-- Fırın için ON/OFF düğmeleri -->
                <div class="guc-dugmeleri">
                    <button class="btn-on aktif-buton">ON</button>
                    <button class="btn-off">OFF</button>
                </div>
            </div>
        </section>

        <!-- 3. SÜTUN: ENJEKSİYON MAKİNALARI (19 Adet buraya gelecek) -->
        <section class="sutun" id="makinalar-sutunu">
            <h2>ENJEKSİYON MAKİNALARI</h2>
            <p class="aciklama">Üretim Hattı</p>

            <!-- Örnek bir Makina Kutusu (Umbau lambası ile) -->
            <div class="makina-kutusu">
                <!-- Umbau lambası: "umbau-aktif" sınıfı silinirse lamba söner -->
                <div class="umbau-lambasi umbau-aktif" title="Kalıp Değişimi (Umbau) Yapılıyor"></div>
                <div class="kutu-baslik">Makina 1</div>
                <div class="kutu-bilgi">Ürün: Kapak V2</div>
                <!-- Makina için ON/OFF düğmeleri -->
                <div class="guc-dugmeleri">
                    <button class="btn-on">ON</button>
                    <button class="btn-off aktif-buton">OFF</button>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
