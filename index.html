<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBP Kunststoffwerk - Üretim Takip</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- YÜZEN KONTROL PANELİ (Sol üstte sabit kalır, haritayı engellemez) -->
    <div id="kontrol-paneli">
        <h2 style="margin:0 0 10px 0; font-size:16px; color:#3498db;">BBP Üretim Takip</h2>
        <div class="zoom-araclari">
            <button id="btn-zoom-out">-</button>
            <span id="zoom-seviyesi">100%</span>
            <button id="btn-zoom-in">+</button>
            <button id="btn-zoom-reset">Sıfırla</button>
        </div>
        <p class="ipucu">Ekranı kaydırmak için <b>BOŞLUK</b> tuşuna basılı tutup fareyle sürükleyin.</p>
    </div>

    <!-- EKRAN ÇERÇEVESİ (Kamera) -->
    <main id="fabrika-sahasi">
        <!-- İÇİNDEKİ DEV SAHNE (Zoom ve Kaydırma bu katmanda olur) -->
        <div id="sahne">
            <canvas id="cizim-alani" width="3000" height="3000"></canvas>
            <div id="cihazlar-kapsayici"></div>
        </div>
    </main>

    <!-- DETAY PENCERESİ (MODAL) -->
    <div id="detay-modal" class="modal" style="display: none;">
        <div class="modal-icerik">
            <span class="kapat-btn" id="modal-kapat">&times;</span>
            <h3 id="modal-baslik">Detay Ayarları</h3>
            <label id="modal-etiket">Materyal/Bilgi:</label>
            <input type="text" id="modal-input-veri" class="modal-input">
            
            <div id="gelen-baglantilar-alani" style="background: #eef2f5; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                <h4 style="margin: 0 0 5px 0; color: #2c3e50;">📥 Gelen Malzemeler (Kaynaklar)</h4>
                <ul id="gelen-listesi" style="margin: 0; padding-left: 20px; font-size: 13px; color: #444;"></ul>
            </div>
            
            <div id="modal-baglanti-alani">
                <hr>
                <h4 style="margin-bottom: 5px;">📤 Giden Bağlantılar (Hedefler)</h4>
                
                <div id="silo-kanallari-inputlari">
                    <label>Kanal 1:</label> <input type="text" id="modal-kanal-1" class="modal-input">
                    <label>Kanal 2:</label> <input type="text" id="modal-kanal-2" class="modal-input">
                    <label>Kanal 3:</label> <input type="text" id="modal-kanal-3" class="modal-input">
                    <label>Kanal 4:</label> <input type="text" id="modal-kanal-4" class="modal-input">
                </div>
                <div id="firin-hedef-inputu" style="display: none;">
                    <label>Hedef Makina:</label> <input type="text" id="modal-firin-hedef" class="modal-input">
                </div>
            </div>
            <button id="modal-kaydet" class="kaydet-btn">Kaydet ve Güncelle</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
