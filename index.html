<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BBP SCADA V6 - Full Digital Twin (Mobile & PC)</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --grid-color: rgba(255, 255, 255, 0.05);
            --machine-green: linear-gradient(145deg, #78e08f, #38ada9);
            --machine-border: #b8e994;
            --silo-metal: radial-gradient(circle at 30% 30%, #ecf0f1, #95a5a6, #2c3e50);
            --oven-body: linear-gradient(to right, #bdc3c7, #7f8c8d);
            --oven-motor: linear-gradient(to top, #e67e22, #d35400);
            --tpe-motor: linear-gradient(to top, #f39c12, #f1c40f);
            --pipe-main: #00d2d3;
            --pipe-glow: 0 0 10px #00d2d3, 0 0 15px #00d2d3;
            --text-light: #ecf0f1;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; background-color: var(--bg-dark); color: var(--text-light); overflow: hidden; touch-action: none; overscroll-behavior: none; }

        /* ÜST BAR */
        #top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(11, 12, 16, 0.95); border-bottom: 2px solid #1e272e; z-index: 2000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; backdrop-filter: blur(10px); }
        .logo { font-size: 16px; font-weight: bold; color: var(--pipe-main); text-shadow: 0 0 10px var(--pipe-main); line-height: 1.1; }
        .controls { display: flex; gap: 5px; align-items: center; }
        .controls button { background: #2f3640; color: white; border: 1px solid #718093; padding: 12px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.1s;}
        .controls button:active { background: var(--pipe-main); color: #000; transform: scale(0.95);}

        /* SCADA SAHNESİ */
        #scada-viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; cursor: grab; }
        #scada-viewport:active { cursor: grabbing; }
        /* Harita ebatını devasa yaptık (6000x4000) */
        #scada-canvas { width: 6000px; height: 4000px; position: absolute; top: 0; left: 0; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 50px 50px; transform-origin: 0 0; }

        /* BÖLGELER (Zone) */
        .zone { position: absolute; border: 2px dashed rgba(52, 152, 219, 0.4); border-radius: 10px; background: rgba(52, 152, 219, 0.03); pointer-events: none; }
        .zone-label { position: absolute; top: -14px; left: 20px; background: var(--bg-dark); padding: 0 10px; color: #3498db; font-size: 14px; font-weight: bold; z-index: 5;}
        
        /* BORULAR (Line) */
        .pipe { position: absolute; background: var(--pipe-main); box-shadow: var(--pipe-glow); z-index: 1; pointer-events: none;}
        .pipe-h { height: 6px; } .pipe-v { width: 6px; }
        .flow-h { background: linear-gradient(90deg, #00d2d3 25%, #fff 50%, #00d2d3 75%); background-size: 200% 100%; animation: flowH 1.5s linear infinite; }
        .flow-v { background: linear-gradient(180deg, #00d2d3 25%, #fff 50%, #00d2d3 75%); background-size: 100% 200%; animation: flowV 1.5s linear infinite; }
        @keyframes flowH { to { background-position: -200% 0; } } @keyframes flowV { to { background-position: 0 -200%; } }

        /* CİHAZLAR */
        .device { position: absolute; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; text-align: center; color: #111; z-index: 10; transition: transform 0.2s; }
        
        @media (hover: hover) and (pointer: fine) {
            .device:hover { transform: scale(1.1); z-index: 50; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
            .device:hover .info-card { display: block; bottom: 135%; }
        }

        .silo { width: 45px; height: 45px; border-radius: 50%; background: var(--silo-metal); border: 2px solid #7f8c8d; }
        .oven { width: 40px; height: 50px; background: var(--oven-body); border-radius: 4px; flex-direction: column; justify-content: flex-end; padding-bottom: 5px; }
        .oven::before { content: ''; position: absolute; top: -10px; left: 10px; width: 20px; height: 15px; background: var(--oven-motor); border-radius: 4px 4px 0 0; }
        .oven-tpe::before { background: var(--tpe-motor); }

        .machine { background: var(--machine-green); border: 2px solid var(--machine-border); border-radius: 6px; color: #fff; text-shadow: 1px 1px 2px #000; flex-direction: column;}
        .m-h { width: 130px; height: 60px; } 
        .m-v { width: 60px; height: 130px; }
        .m-large-h { width: 160px; height: 75px; } 
        .m-large-v { width: 75px; height: 160px; }

        /* BESLEME NODÜLLERİ (Girişler) */
        .nodes-container { position: absolute; display: flex; gap: 4px; }
        .m-h .nodes-container, .m-large-h .nodes-container { top: -8px; left: 10px; flex-direction: row; }
        .m-v .nodes-container, .m-large-v .nodes-container { left: -8px; top: 10px; flex-direction: column; }
        .node { width: 10px; height: 10px; background: #f1c40f; border: 2px solid #222; border-radius: 50%; }
        
        .status-led { position: absolute; bottom: 5px; right: 5px; width: 6px; height: 6px; background: #0be881; border-radius: 50%; box-shadow: 0 0 10px #0be881; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* HOVER / DOKUNMA BİLGİ KARTI */
        .info-card { display: none; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); width: max-content; background: #2f3640; border: 1px solid #00d2d3; padding: 10px; border-radius: 8px; color: #fff; font-size: 12px; font-weight: normal; text-align: left; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.9); }
        .device.active-touch .info-card { display: block; bottom: 135%; }

        /* SEYYAR KONTEYNER (Sürükle Bırak) */
        .local-bin { position: absolute; width: 35px; height: 35px; background: #8e44ad; border: 2px solid #9b59b6; border-radius: 4px; color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: grab; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); touch-action: none;}
        .local-bin:active { cursor: grabbing; box-shadow: 0 8px 20px rgba(0,0,0,0.8); }

        /* MODAL */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(5px);}
        .modal-box { background: #1e272e; border: 2px solid var(--pipe-main); padding: 20px; border-radius: 12px; width: 90%; max-width: 450px; color: #fff; box-shadow: 0 0 30px rgba(0,210,211,0.3); }
        .m-header { font-size: 18px; font-weight: bold; color: var(--pipe-main); border-bottom: 1px dashed #555; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .close-btn { color: #ff4757; font-size: 24px; padding: 0 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="logo">BBP SCADA<br><span style="font-size:11px; color:#aaa;">V6 FULL - FABRİKA İKİZİ</span></div>
        <div class="controls">
            <button id="btn-zoom-in">+</button>
            <button id="btn-zoom-out">-</button>
            <button id="btn-center">⌖ Merkezle</button>
        </div>
    </div>

    <div id="scada-viewport">
        <div id="scada-canvas">
            
            <!-- 1. BÖLGELER -->
            <div class="zone" style="width: 800px; height: 350px; left: 4500px; top: 2500px;"><div class="zone-label">NSILO & LAGERHALLE (Silo Farm)</div></div>
            <div class="zone" style="width: 800px; height: 200px; left: 3500px; top: 2500px;"><div class="zone-label">ZENTRALE 1 (1-7) & TPE STATION</div></div>
            <div class="zone" style="width: 500px; height: 180px; left: 1200px; top: 1200px;"><div class="zone-label">ZENTRALE 2 (12-16) - Werkzeugbau</div></div>
            <div class="zone" style="width: 400px; height: 150px; left: 3200px; top: 1800px;"><div class="zone-label">LOKAL STATION (8-11)</div></div>
            <div class="zone" style="width: 600px; height: 350px; left: 800px; top: 1800px;"><div class="zone-label">BEREICH 1700</div></div>
            <div class="zone" style="width: 1400px; height: 1100px; left: 1600px; top: 1400px;"><div class="zone-label">PRODUKTION HALLE</div></div>

            <!-- 2. ANA OMURGA BORULARI -->
            <div class="pipe pipe-v flow-v" style="left: 3700px; top: 1600px; height: 900px;"></div>
            <div class="pipe pipe-h flow-h" style="left: 1000px; top: 1600px; width: 2700px;"></div>
            <div class="pipe pipe-v flow-v" style="left: 1300px; top: 1380px; height: 220px;"></div>
            <div class="pipe pipe-v flow-v" style="left: 1100px; top: 1600px; height: 200px;"></div>
            <div class="pipe pipe-v flow-v" style="left: 1800px; top: 1600px; height: 500px;"></div>
            <div class="pipe pipe-v flow-v" style="left: 2100px; top: 1600px; height: 700px;"></div>
            <div class="pipe pipe-v flow-v" style="left: 2600px; top: 1600px; height: 700px;"></div>
            <div class="pipe pipe-v flow-v" style="left: 3100px; top: 1600px; height: 300px;"></div>

            <!-- 3. SEYYAR KONTEYNERLER -->
            <div class="local-bin" style="left: 1850px; top: 1800px; background:#e67e22;">Mühle</div>
            <div class="local-bin" style="left: 1850px; top: 1850px; background:#34495e;">Boya 1</div>
            <div class="local-bin" style="left: 2150px; top: 2000px; background:#8e44ad;">Katkı</div>
            <div class="local-bin" style="left: 2750px; top: 1750px; background:#34495e;">Boya 2</div>
            <div class="local-bin" style="left: 1050px; top: 1950px; background:#16a085;">TPE Ek</div>

            <div id="devices-container"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal">
        <div class="modal-box">
            <div class="m-header"><span id="m-title">Cihaz</span> <span class="close-btn" id="btn-close-modal">✖</span></div>
            <div id="m-content" style="font-size:14px; line-height: 1.6;"></div>
        </div>
    </div>

    <script>
        const db = [
            // SILO FARM (18 Silo)
            { id: 's1', type: 'silo', name: 'S1', x: 4550, y: 2550 }, { id: 's2', type: 'silo', name: 'S2', x: 4620, y: 2550 },
            { id: 's3', type: 'silo', name: 'S3', x: 4690, y: 2550 }, { id: 's4', type: 'silo', name: 'S4', x: 4760, y: 2550 },
            { id: 's5', type: 'silo', name: 'S5', x: 4830, y: 2550 }, { id: 's6', type: 'silo', name: 'S6', x: 4900, y: 2550 },
            { id: 's7', type: 'silo', name: 'S7', x: 4970, y: 2550 }, { id: 's8', type: 'silo', name: 'S8', x: 5040, y: 2550 },
            { id: 's9', type: 'silo', name: 'S9', x: 5110, y: 2550 },
            { id: 's10', type: 'silo', name: 'S10', x: 4550, y: 2650 }, { id: 's11', type: 'silo', name: 'S11', x: 4620, y: 2650 },
            { id: 's12', type: 'silo', name: 'S12', x: 4690, y: 2650 }, { id: 's13', type: 'silo', name: 'S13', x: 4760, y: 2650 },
            { id: 's14', type: 'silo', name: 'S14', x: 4830, y: 2650 }, { id: 's15', type: 'silo', name: 'S15', x: 4900, y: 2650 },
            { id: 's16', type: 'silo', name: 'S16', x: 4970, y: 2650 }, { id: 's17', type: 'silo', name: 'S17', x: 5040, y: 2650 },
            { id: 's18', type: 'silo', name: 'S18', x: 5110, y: 2650 },

            // ZENTRALE 1 & TPE
            { id: 'f1', type: 'oven', name: 'F1', x: 3550, y: 2550 }, { id: 'f2', type: 'oven', name: 'F2', x: 3620, y: 2550 },
            { id: 'f3', type: 'oven', name: 'F3', x: 3690, y: 2550 }, { id: 'f4', type: 'oven', name: 'F4', x: 3760, y: 2550 },
            { id: 'f5', type: 'oven', name: 'F5', x: 3830, y: 2550 }, { id: 'f6', type: 'oven', name: 'F6', x: 3900, y: 2550 },
            { id: 'f7', type: 'oven', name: 'F7', x: 3970, y: 2550 },
            { id: 'tpe1', type: 'oven oven-tpe', name: 'TPE 1', x: 4100, y: 2550 },
            { id: 'tpe2', type: 'oven oven-tpe', name: 'TPE 2', x: 4170, y: 2550 },
            { id: 'tpe3', type: 'oven oven-tpe', name: 'TPE 3', x: 4240, y: 2550 },

            // ZENTRALE 2
            { id: 'f12', type: 'oven', name: 'F12', x: 1250, y: 1250 }, { id: 'f13', type: 'oven', name: 'F13', x: 1320, y: 1250 },
            { id: 'f14', type: 'oven', name: 'F14', x: 1390, y: 1250 }, { id: 'f15', type: 'oven', name: 'F15', x: 1460, y: 1250 },
            { id: 'f16', type: 'oven', name: 'F16', x: 1530, y: 1250 },

            // LOKAL STATION
            { id: 'f8', type: 'oven', name: 'F8', x: 3250, y: 1850 }, { id: 'f9', type: 'oven', name: 'F9', x: 3320, y: 1850 },
            { id: 'f10', type: 'oven', name: 'F10', x: 3390, y: 1850 }, { id: 'f11', type: 'oven', name: 'F11', x: 3460, y: 1850 },

            // MAKİNELER
            { id: 'm1700-1', type: 'machine', name: 'K 1700-01', nodes: 4, dir: 'm-large-h', x: 900, y: 1900 },
            { id: 'm1700-2', type: 'machine', name: 'K 1700-02', nodes: 4, dir: 'm-large-h', x: 1100, y: 1900 },
            { id: 'm1300', type: 'machine', name: 'K 1300', nodes: 3, dir: 'm-large-h', x: 900, y: 2000 },

            { id: 'm400-1', type: 'machine', name: 'K 400-01', nodes: 2, dir: 'm-v', x: 1700, y: 1650 },
            { id: 'm400-2', type: 'machine', name: 'K 400-02', nodes: 2, dir: 'm-v', x: 1700, y: 1800 },
            { id: 'm400-3', type: 'machine', name: 'K 400-03', nodes: 2, dir: 'm-v', x: 1700, y: 1950 },
            
            { id: 'm600-1', type: 'machine', name: 'K 600-01', nodes: 2, dir: 'm-h', x: 1900, y: 1650 },
            { id: 'm650-1', type: 'machine', name: 'K 650-01', nodes: 3, dir: 'm-large-h', x: 2200, y: 1650 },
            { id: 'm650-2', type: 'machine', name: 'SP 0650-2', nodes: 4, dir: 'm-large-h', x: 2400, y: 1650 }, 
            { id: 'm1000-2', type: 'machine', name: 'K 1000-02', nodes: 4, dir: 'm-large-h', x: 2700, y: 1650 },

            { id: 'm800-1', type: 'machine', name: 'K 800-01', nodes: 2, dir: 'm-v', x: 2000, y: 2100 },
            { id: 'm800-4', type: 'machine', name: 'K 800-04', nodes: 2, dir: 'm-v', x: 2150, y: 2100 },
            { id: 'm900-1', type: 'machine', name: 'K 900-01', nodes: 3, dir: 'm-large-v', x: 2500, y: 2100 },
            { id: 'm600-7', type: 'machine', name: 'SP 0600-7', nodes: 3, dir: 'm-large-v', x: 2800, y: 2100 } 
        ];

        const container = document.getElementById('devices-container');
        
        db.forEach(dev => {
            let el = document.createElement('div');
            el.className = `device ${dev.type} ${dev.dir || ''}`;
            el.style.left = dev.x + 'px'; el.style.top = dev.y + 'px';
            
            let nodesHtml = '';
            if (dev.nodes) {
                nodesHtml = `<div class="nodes-container">`;
                for(let i=0; i<dev.nodes; i++) nodesHtml += `<div class="node"></div>`;
                nodesHtml += `</div><div class="status-led"></div>`;
            }

            let infoHtml = `<div class="info-card">
                <div style="color:var(--pipe-main); font-weight:bold; border-bottom:1px solid #555; padding-bottom:3px; margin-bottom:5px;">${dev.name}</div>
                ${dev.type==='silo' ? 'Doluluk: Veri Bekleniyor' : (dev.type==='machine' ? 'Kalip: Veri Bekleniyor' : 'Durum: Aktif')}
                <br><span style="font-size:10px; color:#f1c40f; display:block; margin-top:5px;">(Ayarlar için çift tıkla/dokun)</span>
            </div>`;

            el.innerHTML = nodesHtml + dev.name + infoHtml;
            
            const openDeviceModal = () => {
                document.getElementById('m-title').innerText = dev.name + " - İstasyon Ayarları";
                let content = "";
                
                if(dev.type === 'machine') {
                    content = `
                        <div style="margin-bottom:15px;"><b>Aktif Kalıp / Sipariş:</b> <span style="color:#f1c40f">BBP_Standart_Part</span></div>
                        <div style="background:#2f3640; padding:15px; border-radius:8px;">
                            <b>Bağlantı Reçetesi (Kupplungsbahnhof):</b><br><br>
                            📥 Giriş 1 (Ana Hat): <span style="color:#00d2d3">Fırın 3 (Silo 4 - PP)</span><br>
                            📥 Giriş 2 (Katkı): <span style="color:#00d2d3">Fırın 14 (ABS)</span><br>
                            ${dev.nodes >= 3 ? '📥 Giriş 3 (Gummi): <span style="color:#e67e22">TPE 1</span><br>' : ''}
                            ${dev.nodes >= 4 ? '📥 Giriş 4 (Lokal): <span style="color:#9b59b6">Seyyar Boya (Manuel)</span><br>' : ''}
                        </div>
                    `;
                } else if(dev.type === 'silo') {
                    content = `Durum: Aktif.<br>Malzeme: <b>Seculene / PP</b><br>Doluluk Oranı: <b>%85</b>`;
                } else {
                    content = `Fırın Sıcaklığı: <b>85°C</b><br>Kurutma Durumu: <b>Devrede</b><br><br>Rota atamaları ana veritabanından güncelleniyor.`;
                }
                
                document.getElementById('m-content').innerHTML = content;
                document.getElementById('modal').style.display = 'flex';
            };

            el.addEventListener('dblclick', (e) => { e.stopPropagation(); openDeviceModal(); });

            let lastTap = 0;
            el.addEventListener('touchend', (e) => {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                
                document.querySelectorAll('.device').forEach(d => d.classList.remove('active-touch'));
                el.classList.add('active-touch');

                if (tapLength < 300 && tapLength > 0) { e.preventDefault(); openDeviceModal(); }
                lastTap = currentTime;
            });
            
            container.appendChild(el);
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => { document.getElementById('modal').style.display = 'none'; });
        document.getElementById('scada-viewport').addEventListener('touchstart', (e) => {
            if(!e.target.closest('.device')) document.querySelectorAll('.device').forEach(d => d.classList.remove('active-touch'));
        });

        // ZOOM & PAN
        const canvas = document.getElementById('scada-canvas');
        const viewport = document.getElementById('scada-viewport');
        let scale = 0.25, panX = -200, panY = -300; 
        let isDragging = false, startX, startY;

        function updateTransform() { canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }

        document.getElementById('btn-zoom-in').addEventListener('click', () => { scale = Math.min(scale * 1.3, 2.5); updateTransform(); });
        document.getElementById('btn-zoom-out').addEventListener('click', () => { scale = Math.max(scale * 0.7, 0.05); updateTransform(); });
        document.getElementById('btn-center').addEventListener('click', () => { scale = 0.25; panX = -200; panY = -300; updateTransform(); });

        viewport.addEventListener('mousedown', e => {
            if(e.target.classList.contains('local-bin') || e.target.closest('.device')) return; 
            isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; canvas.style.transition = 'none';
        });
        window.addEventListener('mousemove', e => { if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); });
        window.addEventListener('mouseup', () => { isDragging = false; canvas.style.transition = 'transform 0.1s'; });

        viewport.addEventListener('touchstart', e => {
            if(e.target.classList.contains('local-bin') || e.target.closest('.device')) return; 
            isDragging = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY; canvas.style.transition = 'none';
        });
        window.addEventListener('touchmove', e => {
            if (!isDragging || e.touches.length !== 1) return;
            panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; updateTransform();
        }, {passive: false});
        window.addEventListener('touchend', () => { isDragging = false; canvas.style.transition = 'transform 0.1s'; });

        // SÜRÜKLE BIRAK
        let draggedBin = null, offsetX = 0, offsetY = 0;

        document.querySelectorAll('.local-bin').forEach(bin => {
            bin.addEventListener('mousedown', e => {
                e.stopPropagation(); draggedBin = bin;
                let rect = bin.getBoundingClientRect();
                offsetX = (e.clientX - rect.left) / scale; offsetY = (e.clientY - rect.top) / scale;
                bin.style.zIndex = 2000;
            });
            bin.addEventListener('touchstart', e => {
                e.stopPropagation(); draggedBin = bin;
                let rect = bin.getBoundingClientRect();
                offsetX = (e.touches[0].clientX - rect.left) / scale; offsetY = (e.touches[0].clientY - rect.top) / scale;
                bin.style.zIndex = 2000; bin.style.transform = "scale(1.2)";
            }, {passive: false});
        });

        const handleDragMove = (clientX, clientY, e) => {
            if (!draggedBin) return;
            if (e && e.preventDefault) e.preventDefault();
            let canvasRect = canvas.getBoundingClientRect();
            let newX = (clientX - canvasRect.left) / scale - offsetX;
            let newY = (clientY - canvasRect.top) / scale - offsetY;
            draggedBin.style.left = newX + 'px'; draggedBin.style.top = newY + 'px';
        };

        window.addEventListener('mousemove', e => { if (draggedBin) handleDragMove(e.clientX, e.clientY, e); });
        window.addEventListener('touchmove', e => { if (draggedBin) handleDragMove(e.touches[0].clientX, e.touches[0].clientY, e); }, {passive: false});

        const handleDragEnd = () => {
            if(draggedBin) { draggedBin.style.zIndex = 100; draggedBin.style.transform = "scale(1)"; draggedBin = null; }
        };
        window.addEventListener('mouseup', handleDragEnd);
        window.addEventListener('touchend', handleDragEnd);

        updateTransform();
    </script>
</body>
</html>
